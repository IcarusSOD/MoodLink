<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodLink Widget</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 80%; }
        input { width: 100%; margin: 15px 0; }
        button { background: #0088cc; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h2>MoodLink</h2>
    <p>Энергия: <span id="energyVal">50</span>%</p>
    <input type="range" id="energySlider" min="0" max="100" value="50" oninput="energyVal.innerText = this.value">
    
    <p>Настроение: <span id="moodVal">50</span>%</p>
    <input type="range" id="moodSlider" min="0" max="100" value="50" oninput="moodVal.innerText = this.value">
    
    <br>
    <button id="sendBtn">Отправить статус</button>
</div>

<script>
    let tg = window.Telegram.WebApp; 
    tg.expand(); // Развернуть на всё окно

    let btn = document.getElementById("sendBtn");

    btn.addEventListener("click", function() {
        let e = document.getElementById("energySlider").value;
        let m = document.getElementById("moodSlider").value;
        
        // Формируем текст сообщения
        let stat = "⚡ Энергия: " + e + "%, 😊 Настроение: " + m + "%";
        
        // ОТПРАВКА ДАННЫХ БОТУ
        tg.sendData(stat); 
    });
</script>

</body>
</html>
